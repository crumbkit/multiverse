# The environment variables that the mxv command reads. The catalog
# `VARIABLES` in crates/mxv/src/environment.rs lists the ones that mxv's own
# code reads, and this file describes them in the same words. The variables
# after `PATH` are read by crates that mxv links: crumbkit, crumbkit-usage
# and crumbkit-skills. mxv does not link crumbkit-starmap, so nothing else
# declares those for mxv, and they are declared here. The test in
# crates/mxv/tests/starmap.rs checks that this file declares exactly the
# catalog, `PATH` and the crumbkit variables that the test lists.
#
# mxv reads no secret.
#
# This file leaves out three groups on purpose:
#
# - The variables of `PASSED_THROUGH` in crates/multiverse/src/phase_plan.rs,
#   such as `LANG` and `SSH_AUTH_SOCK`, and every `DOCKER_*` variable. mxv
#   copies them from its own environment to the host processes and docker
#   commands that phase starts, and it never uses their values itself.
# - The variables that the is-ai-agent crate looks for, such as `CLAUDECODE`
#   and `CODEX_THREAD_ID`. crumbkit and crumbkit-usage read them to tell a
#   person from a coding agent, and that crate owns the list, which changes
#   with its version.
# - `USERPROFILE` and `WT_SESSION`, which crumbkit and crumbkit-usage read
#   only on Windows, where mxv does not run.

[variables.HOME]
purpose = "The person's home directory, which each base directory defaults to a directory in and which a config file's `root` may start with `~/` for."
effect = "When it is unset or empty, mxv reads the home directory from the user database, and when it finds none a workspace command fails with mxv::environment::no_directory."
type = "path"
unset = "optional"
show = "shown"
source = "inherited"

[variables.XDG_CONFIG_HOME]
purpose = "The config directory, where mxv reads its config file from `$XDG_CONFIG_HOME/mxv/config.toml`."
effect = "When it is unset, empty or relative, mxv uses `~/.config`. crumbkit reads the same variable for `mxv completion install`."
type = { path = { absolute = true } }
unset = "optional"
show = "shown"
source = "inherited"

[variables.XDG_DATA_HOME]
purpose = "The data directory, which holds the default workspace root `$XDG_DATA_HOME/mxv/workspaces`, one bare mirror for each origin in `$XDG_DATA_HOME/mxv/mirrors`, and the ignored files that an archive keeps."
effect = "When it is unset, empty or relative, mxv uses `~/.local/share`. crumbkit reads the same variable for `mxv completion install`."
type = { path = { absolute = true } }
unset = "optional"
show = "shown"
source = "inherited"

[variables.XDG_STATE_HOME]
purpose = "The state directory, which holds each workspace's record, lock and marks, the run records and logs of its units, and each archive's record, all under `$XDG_STATE_HOME/mxv`."
effect = "When it is unset, empty or relative, mxv uses `~/.local/state`. crumbkit-usage reads the same variable to find the usage log."
type = { path = { absolute = true } }
unset = "optional"
show = "shown"
source = "inherited"

[variables.DEADBAND_SOCKET]
purpose = "The path of the socket of deadband, the machine's job limiter, which `mxv up` and `mxv restart` ask for a place before a process's `build`, and `mxv run` before a task."
effect = "When it is unset or empty, mxv looks for `deadband.sock` in `DEADBAND_SOCKET_DIR`, then in the per-user temporary directory on macOS, then in `TMPDIR`, then in `$XDG_RUNTIME_DIR/deadband`, and last in `/tmp/deadband-<uid>`, where `<uid>` is the user's numeric id. When no daemon answers, the build or task starts at once."
type = "path"
unset = "optional"
show = "shown"
source = "inherited"

[variables.DEADBAND_SOCKET_DIR]
purpose = "The directory that holds deadband's socket, named `deadband.sock`, which applies when `DEADBAND_SOCKET` is unset or empty."
effect = "When it is unset or empty, mxv looks in the per-user temporary directory on macOS, then in `TMPDIR`, then in `$XDG_RUNTIME_DIR/deadband`, and last in `/tmp/deadband-<uid>`."
type = "path"
unset = "optional"
show = "shown"
source = "inherited"

[variables.TMPDIR]
purpose = "The temporary directory, which holds deadband's socket when `DEADBAND_SOCKET` and `DEADBAND_SOCKET_DIR` are unset and the system has no per-user temporary directory."
effect = "When it is unset or empty, mxv uses `$XDG_RUNTIME_DIR/deadband/deadband.sock`, or `/tmp/deadband-<uid>/deadband.sock` when `XDG_RUNTIME_DIR` is unset or empty too, where `<uid>` is the user's numeric id."
type = "path"
unset = "optional"
show = "shown"
source = "inherited"

[variables.XDG_RUNTIME_DIR]
purpose = "The user's runtime directory, which holds deadband's socket in `deadband/deadband.sock` when `DEADBAND_SOCKET`, `DEADBAND_SOCKET_DIR` and `TMPDIR` are unset and the system has no per-user temporary directory."
effect = "When it is unset or empty, mxv uses `/tmp/deadband-<uid>/deadband.sock`, where `<uid>` is the user's numeric id."
type = "path"
unset = "optional"
show = "shown"
source = "inherited"

[variables.DEADBAND_HELD]
purpose = "Set by deadband to 1 for a job that it granted. When it is set to anything but 0, a `build` or a task started under that job runs at once, because the job already holds a place."
effect = "When it is unset, empty or 0, mxv asks deadband for a place."
type = "string"
unset = "optional"
show = "shown"
source = "inherited"

[variables.DEADBAND_BYPASS]
purpose = "When it is set to anything but 0, a `build` or a task runs at once without asking deadband for a place."
effect = "When it is unset, empty or 0, mxv asks deadband for a place."
type = "string"
unset = "optional"
show = "shown"
source = "inherited"

[variables.MXV_ROOT]
purpose = "The directory that holds one directory for each workspace, which wins over the config file's `root`, which wins over `$XDG_DATA_HOME/mxv/workspaces`."
effect = "When it is unset or empty, mxv uses the next of those, and when it is relative a command that needs the root fails with mxv::environment::relative_root."
type = "path"
unset = "optional"
show = "shown"
source = "setting"

[variables.PATH]
purpose = "The search path that mxv uses to find the `caddy` program that serves the proxy, when the config file names none. phase also gives it to every host process and to the `docker` commands that run containers, and builds a sandboxed process's read grants from its directories."
effect = "When it is unset, mxv searches no directory for `caddy`, and phase gives the processes and docker commands no PATH. An empty PATH is not told apart from a path of one empty entry, so the search for `caddy` also tries a program named `caddy` in the directory that mxv started in."
type = "path"
unset = "optional"
show = "shown"
source = "inherited"

[variables.TERM]
purpose = "The kind of terminal that mxv prints to, which crumbkit reads for colour; dumb turns colour off in mxv's output."
effect = "Colour follows the other colour variables and whether the stream is a terminal."
type = "string"
unset = "optional"
show = "shown"
source = "inherited"

[variables.NO_COLOR]
purpose = "Turns colour off in mxv's output when it holds any value, which crumbkit reads."
effect = "Colour follows CLICOLOR_FORCE, CLICOLOR, TERM and whether the stream is a terminal."
type = "string"
unset = "optional"
show = "shown"
source = "inherited"

[variables.CLICOLOR]
purpose = "Turns colour off in mxv's output when it is 0, which crumbkit reads."
effect = "Colour follows the terminal."
type = "string"
unset = "optional"
show = "shown"
source = "inherited"

[variables.CLICOLOR_FORCE]
purpose = "Turns colour on in mxv's output, whatever the stream is, when it holds a value other than 0, which crumbkit reads."
effect = "Colour follows the terminal."
type = "string"
unset = "optional"
show = "shown"
source = "inherited"

[variables.MXV_OUTPUT_BUDGET]
purpose = "The most bytes that one run of mxv prints, which lowers mxv's own limit and never raises it, and which crumbkit reads."
effect = "A value that is not a whole number of bytes from 1 up to mxv's limit leaves the limit as it is."
type = { integer = { min = 1, max = 4294967295 } }
unset = "optional"
show = "shown"
source = "setting"

[variables.MXV_PROGRAM]
purpose = "The name of the program that runs mxv, such as a script or an agent, which crumbkit-usage records in the usage log."
effect = "The usage log records no program name, and a value that is not a program name prints a warning on standard error and is ignored."
type = { string = { pattern = "^[a-z][a-z0-9_-]{0,31}$" } }
unset = "optional"
show = "shown"
source = "setting"

[variables.TRACEPARENT]
purpose = "The W3C trace context of the caller, which crumbkit-usage joins in the usage log."
effect = "The run starts a new trace."
type = "string"
unset = "optional"
show = "shown"
source = "inherited"

[variables.TRACESTATE]
purpose = "The W3C trace state of the caller, which goes with TRACEPARENT."
effect = "The run records no trace state."
type = "string"
unset = "optional"
show = "shown"
source = "inherited"

[variables.COMPLETE]
purpose = "Asks mxv to answer a shell's completion request, with the name of the shell as its value, as the registration that `mxv completion install` writes sets it."
effect = "mxv runs as a command, and answers no completion request."
type = "string"
unset = "optional"
show = "shown"
source = "inherited"

[variables.SHELL]
purpose = "The person's shell, whose file name `mxv completion install`, `check` and `print` use when no `--shell` is given."
effect = "A completion command without `--shell` fails and asks for it."
type = "path"
unset = "optional"
show = "shown"
source = "inherited"

[variables.FPATH]
purpose = "The function search path of zsh, which `mxv completion install` reads to choose the directory of the zsh completion file: `~/.zfunc` when it is on the path, or else the first directory on the path that is inside the home directory and exists."
effect = "The command writes the file in `~/.zfunc` and prints the line to add to `~/.zshrc`."
type = "string"
unset = "optional"
show = "shown"
source = "inherited"

[variables.BASH_COMPLETION_USER_DIR]
purpose = "A list of directories that bash-completion reads before `XDG_DATA_HOME`, of which `mxv completion install` uses the first absolute one to place bash's completion file."
effect = "The command writes bash's completion file under `$XDG_DATA_HOME/bash-completion`."
type = "string"
unset = "optional"
show = "shown"
source = "inherited"

[variables.CODEX_HOME]
purpose = "The directory of Codex, whose `skills` directory `mxv skills install` and `mxv skills check` use beside `~/.claude/skills` and `~/.agents/skills`."
effect = "When it is unset, empty or relative, mxv uses `~/.codex`."
type = { path = { absolute = true } }
unset = "optional"
show = "shown"
source = "inherited"

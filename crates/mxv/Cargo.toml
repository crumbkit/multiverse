[package]
name = "mxv"
description = "The mxv command, which creates, archives and restores task workspaces that span several git repositories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["workspace", "git", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

# The library holds the whole command, so the integration tests can pass its
# parser and guide to crumbkit-test's checks beside the built binary. It is
# not an API for other crates, so it has no docs.
[lib]
name = "mxv"
path = "src/lib.rs"
doc = false

[[bin]]
name = "mxv"
path = "src/main.rs"
# The binary has no API to document, and its docs would take the crate name
# that rustdoc gives the library docs (LIB-2).
doc = false

[dependencies]
# `derive` writes the `Failure` impl of the unbuilt failure from its
# `#[failure(...)]` attribute.
crumbkit = { workspace = true, features = ["derive"] }
# mxv is a binary, so it chooses clap's user-facing features: help, usage
# lines, error context, suggestions for mistyped commands, and colour when
# the output goes to a terminal. These are clap's default features.
clap = { workspace = true, features = [
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "color",
] }
crumbkit-usage = { workspace = true }
# etcetera finds the XDG base directories, as crumbkit does (ADR-0027,
# ADR-0029): the state directory of the records, the config directory of
# the config file, and the data directory of the default workspace root.
etcetera = { workspace = true }
# multiverse holds the workspace operations, their records and the git
# backend that the verbs run.
multiverse = { path = "../multiverse", version = "0.0.0" }
# schemars and serde describe and write the JSON documents that the verbs
# print.
schemars = { workspace = true }
serde = { workspace = true }
# `parse` gives `toml::de::DeTable`, whose keys keep their place in the
# config file, so a failure names the line. mxv reads the parsed values
# directly and needs no other toml feature.
toml = { workspace = true, features = ["parse"] }
# signal-hook catches SIGINT while `mxv exec` runs a command, so Ctrl-C
# leaves mxv running until the command ends, and stops a sandboxed command
# that Ctrl-C does not reach. phase and crumbkit-usage already depend on it.
signal-hook = { workspace = true }

[dev-dependencies]
crumbkit-test = { workspace = true }
# `cmd` runs the built `mxv` binary in the end-to-end tests.
snapbox = { workspace = true, features = ["cmd"] }
# `std` reads the JSON documents and usage log lines that the binary writes.
serde_json = { workspace = true, features = ["std"] }
tempfile = { workspace = true }

[lints]
workspace = true

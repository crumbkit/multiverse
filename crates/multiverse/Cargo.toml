[package]
name = "multiverse"
description = "Task workspaces that span several git repositories, with one worktree per repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["workspace", "git", "worktree"]
categories = ["development-tools"]
include = ["src/**/*.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
wait-timeout = { workspace = true }
# `parse` and `serde` read the manifest `mxv.toml` into typed structs with
# the spans that name a bad key's line.
toml = { workspace = true, features = ["std", "parse", "serde"] }
rustix = { workspace = true }
# `ready = { log = "..." }` compiles its pattern with regex.
regex = { workspace = true }
# sha2 takes the digest of each file that `mxv archive` copies out of a
# workspace's directory, which `mxv restore` checks before it writes it back.
sha2 = { workspace = true }
# phase holds the container engine that `up`, `down`, `status`, `logs` and
# `remove` run a manifest's containers with, the run directory's paths, and
# the rules of workspace and unit names. phase never depends on multiverse.
phase = { package = "mxv-phase", path = "../phase", version = "0.1.1" }

# macOS clones a new checkout's ignored directories with clonefile(2)
# through reflink-copy, and tells its ENOTSUP failure by libc's errno.
# phase reads the process table.
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
reflink-copy = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[package]
name = "mxv-phase"
description = "Runs a workspace's apps locally, as supervised host processes and Docker Compose projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["workspace", "process", "supervisor", "compose"]
categories = ["development-tools"]
include = ["src/**/*.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

# The package is published as `mxv-phase`, and code imports it as `phase`.
[lib]
name = "phase"

[lints]
workspace = true

[features]
default = ["sandbox"]
# `sandbox` applies the operating system's sandbox to a host app that
# declares permissions, through nono. Without it, such an app runs
# unsandboxed and `status` says that phase was built without its sandbox.
# nono turns on serde_json's `preserve_order` for the whole build, so a
# program whose JSON output depends on key order can leave it out.
sandbox = ["dep:nono"]

[dependencies]
serde = { workspace = true }
# The run record is JSON on disk.
serde_json = { workspace = true }
# `sweep` signals the process groups of recorded processes and checks
# whether a group still has a member, without unsafe code.
rustix = { workspace = true }
# A keeper receives `TERM` and `INT` as messages on a thread of its own, so
# it can stop its app's group before it exits.
signal-hook = { workspace = true }
# A plan compiles each log probe's regular expression, and the probe matches
# each new line of a process's log against it, with the same compiler and
# features as mxv's own log readiness check.
regex = { workspace = true }
# phase compares a keyed digest of the values of a process's variables that
# are not secrets, HMAC-SHA-256, to notice a changed value without keeping it.
sha2 = { workspace = true }
hmac = { workspace = true }
# The container engine gives each `docker` command a deadline (BASE-34): it
# waits for the child with a timeout, and kills it when the deadline passes,
# without polling with a sleep (BASE-11).
wait-timeout = { workspace = true }

# Linux reads a process's start in clock ticks from /proc, and the `param`
# feature gives the number of ticks in a second.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["param"] }
# The keeper applies Landlock to an app that declares permissions.
nono = { workspace = true, optional = true }

# macOS reads a process's start time to the microsecond, and the sockets of
# a process's descriptors, with libproc's `proc_pidinfo`, `proc_pidfdinfo`
# and `proc_listpids`, which libc declares.
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
# The keeper applies Seatbelt to an app that declares permissions.
nono = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# A keeper test restores SIGPIPE to its default before it runs the keeper,
# as a program that links phase may leave it, and only libc sets it.
libc = { workspace = true }

# A macOS sandbox test loads the system's trusted roots under the sandbox
# with the crate that the AWS SDK's native-roots TLS uses.
[target.'cfg(target_os = "macos")'.dev-dependencies]
rustls-native-certs = { workspace = true }

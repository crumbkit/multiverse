# The pull-request lane and the scheduled advisory check of the Rust
# standards (BASE-25, BASE-29), from their templates/ci.yml. The `lane` job
# calls the standards' shared lane, so a pull request shows its check as
# `lane / lane`. The `multiverse` job runs the steps that the shared lane does
# not: the MSRV check (LIB-4), the container tests of phase and mxv, and the
# tests of mxv-phase without its sandbox feature. The map's `lanes` decision
# in rust-standards.toml records every lane, and its `lane-commit` decision
# records why the `uses:` commit is ahead of `standards.commit`. The step
# names are the standards' step names, so a failure reads the same in CI and
# in AGENTS.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

# Each job grants only the permissions it needs.
permissions: {}

# A new push cancels the run for the previous push, because the newer run
# checks the same changes and more.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Any compiler or Clippy warning fails the build (BASE-1).
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always

jobs:
  lane:
    if: github.event_name != 'schedule'
    permissions:
      contents: read # actions/checkout reads the repository.
    uses: crumbkit/rust-standards/.github/workflows/rust-lane.yml@5ba71ff31c5f5d8e69b34d04bb65bd0177f7ebeb
    with:
      # multiverse adopts the library profile, so the lane adds the `rustdoc`
      # and `features` steps (LIB-2, LIB-5).
      library: true
      # The pull-request lane's time budget (BASE-25).
      timeout-minutes: 15

  # The steps that the shared lane does not run. The tests run again here
  # with the container test image present, because the shared lane has no
  # step that pulls it.
  multiverse:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the version and components that rust-toolchain.toml
      # names (BASE-26), and the MSRV toolchain that the msrv step uses
      # (LIB-4). Both install before rust-cache, which reads the installed
      # rustc versions for its cache key.
      - run: rustup toolchain install
      - run: rustup toolchain install 1.95.0 --profile minimal
      # install-action runs before rust-cache, so the cache leaves out the
      # tool binaries that install-action downloads on every run.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.140
          fallback: none
      # Only a run on main saves the cache. A pull request restores the cache
      # that main saved and saves none of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # LIB-4: every target builds on the MSRV with every feature.
      - name: msrv
        run: cargo +1.95.0 check --locked --workspace --all-targets --all-features
      # The container tests of phase and mxv run against this runner's
      # docker daemon and skip when their image is missing, so the job
      # pulls it, pinned by digest, and tags it as the tests name it. The
      # digest is the RepoDigest of busybox:1.37.0 on Docker Hub, as
      # `docker image inspect` printed it on 2026-11-05.
      - name: container test image
        run: |
          docker pull --quiet busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          docker tag busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec busybox:1.37.0
      - name: tests
        run: cargo nextest run --locked --workspace --all-features
      # mxv-phase without its default sandbox feature runs every app
      # unsandboxed, and its tests check that it never starts one sandboxed.
      # The step leaves out the engine::container::runner and exec tests
      # because they start real containers and behave the same with and
      # without the feature, and the tests step above already runs them. The
      # other engine::container tests stay, because the feature turns on
      # serde_json's preserve_order and changes the key order they check. A
      # test in the left-out modules that reads the feature must change the
      # filter.
      - name: tests without the sandbox
        run: >-
          cargo nextest run --locked -p mxv-phase --no-default-features
          -E 'not test(/^engine::container::(runner|exec)::/)'

  # Reports whether a pull request changes phase's sandbox, whose Seatbelt
  # tests run only on macOS.
  sandbox-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # gh pr diff lists the pull request's files.
    outputs:
      sandbox: ${{ steps.files.outputs.sandbox }}
    steps:
      - id: files
        run: |
          if gh pr diff "$PR" --repo "$REPO" --name-only | grep -q '^crates/phase/src/sandbox'; then
            echo sandbox=true >> "$GITHUB_OUTPUT"
          else
            echo sandbox=false >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

  # The macOS lane runs the code that only builds on macOS, such as
  # process/darwin.rs and the sandbox's Seatbelt tests, daily, on demand,
  # and on a pull request that changes crates/phase/src/sandbox.rs or
  # crates/phase/src/sandbox/. Other pull requests do not wait for it,
  # because macOS runners queue longer than Linux ones. The container
  # tests skip on this runner, which has no docker daemon.
  macos:
    needs: sandbox-changes
    # !cancelled() lets the lane run when sandbox-changes was skipped, as it
    # is on every event other than a pull request.
    if: >-
      !cancelled() && (github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || needs.sandbox-changes.outputs.sandbox == 'true')
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.140
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features
      - name: tests
        run: cargo nextest run --locked --workspace --all-features
      - name: doctests
        run: cargo test --locked --doc --workspace --all-features

  advisories:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: advisories
        run: cargo deny --locked check advisories

[workspace]
resolver = "3"
members = ["crates/multiverse", "crates/mxv", "crates/phase"]

[workspace.package]
version = "0.1.1"
edition = "2024"
# nono, which applies phase's sandbox, needs Rust 1.95, so the workspace's
# MSRV is 1.95.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crumbkit/multiverse"

[workspace.dependencies]
# clap parses the `mxv` command line. The workspace entry enables only
# `std`, and mxv enables the user-facing features it needs. Cargo turns on a
# feature for every crate in a build when any one crate asks for it, so each
# crate enables only the features its own code needs.
clap = { version = "4.6.7", default-features = false, features = ["std"] }

# crumbkit holds the command-line conventions of the `mxv` command (the cli
# profile of the Rust standards): `parse` and `finish`, documents, failures
# with codes and next steps, and the tool record. The workspace entry enables
# no feature, and mxv enables the ones it uses.
crumbkit = { version = "0.3.1", default-features = false }

# serde reads and writes the workspace records of the multiverse library,
# and mxv derives `Serialize` for the documents it prints.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }

# serde_json is the form of the workspace records on disk. Tests also read
# the JSON documents that the `mxv` binary prints.
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

# schemars describes the JSON documents that mxv prints, which crumbkit's
# `Row` and `Document` need. Only mxv uses it.
schemars = { version = "1.2.3", default-features = false, features = ["std", "derive"] }

# wait-timeout gives each git command a deadline (BASE-34): the library
# waits for the child with a timeout, and kills it when the deadline passes,
# without polling with a sleep (BASE-11).
wait-timeout = "0.2.1"

# etcetera finds the XDG base directories of mxv, as crumbkit does. It has
# no features.
etcetera = { version = "0.11.0", default-features = false }

# toml parses the person's mxv config file and the application manifest
# `mxv.toml`. The workspace entry enables no feature, and each crate enables
# the features its own code needs.
toml = { version = "1.2.1", default-features = false }

# regex matches the log lines of a process against the pattern of its
# `ready = { log = "..." }` check. Its default features hold Unicode
# classes and the search optimisations, and `std` is all it needs besides.
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode", "perf"] }

# sha2 and hmac compute phase's keyed digest of the values of a process's
# variables that are not secrets, as HMAC-SHA-256. nono already builds
# sha2 0.11 for phase, and hmac 0.13 is the release that builds on it.
sha2 = { version = "0.11.1", default-features = false }
hmac = { version = "0.13.0", default-features = false }

# libc declares macOS's libproc calls, proc_pidinfo, proc_pidfdinfo and
# proc_listpids, which read a process's start time to the microsecond and
# the sockets of a process group. Only crates/phase/src/record/process/darwin.rs
# calls them, multiverse uses libc only for an errno, and mxv uses it only
# for `sigaction`. It needs no features beyond `std`.
libc = { version = "0.2.191", default-features = false, features = ["std"] }

# reflink-copy clones a directory tree with clonefile(2) on macOS, which
# shares the blocks of a new checkout's `node_modules/` with the source
# clone's, without unsafe code in mxv. It has no default features, and mxv
# turns on none. It fails where the file system cannot clone, and never
# copies in full.
reflink-copy = { version = "0.1.32", default-features = false }

# rustix sends signals to the process groups of an app's processes and
# checks whether a group still exists, without unsafe code. Its `fs`
# feature deletes a disposable directory by file descriptor with `openat`
# and `unlinkat`, which never follow a directory that becomes a symbolic
# link during the deletion.
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "fs"] }

# tar writes and reads the private file in which `mxv archive` keeps a
# workspace's ignored files, such as `.env`, with each file's permission
# bits and each symbolic link's target, which the standard library cannot
# do. Its default feature reads and writes extended attributes, which mxv
# does not keep, so the workspace entry turns off its default features.
tar = { version = "0.4.46", default-features = false }

# signal-hook turns a keeper's `TERM` and `INT` into messages that a thread
# of the keeper reads, without unsafe code in phase. crumbkit-usage already
# depends on it. The `iterator` feature gives the thread that reads them,
# and it needs `channel`. Those two are the default features.
signal-hook = { version = "0.4.6", default-features = false, features = ["iterator"] }

# crumbkit-usage keeps the `mxv` command's local usage log and adds
# `self usage`, `self figures list` and `self runs list` (CLI-7).
crumbkit-usage = "0.3"

# crumbkit-skills gives the `mxv` command `skills install`, `skills check`
# and `skills print`, which install the agent skill that mxv embeds into the
# agent skills directories and check the installed copies.
crumbkit-skills = "0.3"

# crumbkit-test checks the `mxv` command against crumbkit's conventions
# (CLI-6). Only tests use it.
crumbkit-test = "0.3"

# snapbox runs the built `mxv` binary in the end-to-end tests. Only tests
# use it.
snapbox = { version = "1.2.2", default-features = false }

# tempfile gives each test its own state directory and git repositories,
# which it removes when the test ends. Only tests use it.
tempfile = { version = "3.27.0", default-features = false }

# nono applies the operating system's sandbox to a keeper's app: Seatbelt
# on macOS and Landlock on Linux (decision P9). It is pinned to the exact
# version that /evals/nono-library-for-phase tested, because phase relies on
# the order in which nono's Seatbelt profile emits phase's own network rules.
# Its default feature reads the system keyring, which phase never uses, so
# the workspace entry turns off its default features.
nono = { version = "=0.81.0", default-features = false }

# rustls-native-certs loads the system's trusted roots as the AWS SDK's
# native-roots TLS does. Only a macOS sandbox test of phase uses it, to
# show that a sandboxed process can load them. It has no features.
rustls-native-certs = { version = "0.8.5", default-features = false }

# The lint table is lints/base.toml and lints/library.toml of the Rust
# standards (BASE-1, LIB-2, LIB-3). A build with CARGO_BUILD_WARNINGS=deny
# fails on any warning, and every package inherits the table through
# `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"                   # BASE-3; rust-standards.toml's unsafe-libproc decision names the modules that expect it: phase's record/process/darwin.rs and sandbox/launch.rs, mxv's admission.rs, and five test modules of phase
unreachable_pub = "warn"               # BASE-8
missing_debug_implementations = "warn"
missing_docs = "deny"                  # LIB-2

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny" # LIB-2

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = "deny"                # BASE-2
allow_attributes_without_reason = "deny" # BASE-2
unwrap_used = "deny"                     # BASE-4
expect_used = "deny"                     # BASE-4
panic = "deny"                           # BASE-4
todo = "deny"                            # BASE-4
unimplemented = "deny"                   # BASE-4
dbg_macro = "deny"                       # BASE-4
unreachable = "deny"                     # BASE-4
indexing_slicing = "deny"                # BASE-4
cast_possible_truncation = "deny"        # BASE-12
cast_sign_loss = "deny"                  # BASE-12
cast_possible_wrap = "deny"              # BASE-12
cast_precision_loss = "deny"             # BASE-12
cast_lossless = "deny"                   # BASE-12
disallowed_methods = "deny"              # BASE-5, BASE-6, BASE-7, BASE-11
disallowed_types = "deny"                # BASE-5
disallowed_macros = "deny"               # BASE-7
print_stdout = "deny"                    # BASE-5
print_stderr = "deny"                    # BASE-5
mod_module_files = "deny"                # BASE-9
too_many_lines = "deny"                  # BASE-10
wildcard_imports = "deny"                # BASE-13
enum_glob_use = "deny"                   # BASE-13
ref_option = "deny"                      # BASE-14
needless_for_each = "deny"               # BASE-15
fn_params_excessive_bools = "deny"       # BASE-16
missing_errors_doc = "deny"              # LIB-2
missing_panics_doc = "deny"              # LIB-2
must_use_candidate = "deny"              # LIB-3

# Arithmetic overflow panics in release builds too (BASE-27). The map's
# release-profile decision records why the other settings keep Cargo's
# defaults.
[profile.release]
overflow-checks = true

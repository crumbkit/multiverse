# multiverse's adoption map of the Rust standards (adoption.md of
# https://github.com/crumbkit/rust-standards). The standards have no released
# version yet, so the map names the draft and the commit it was reviewed
# against.

schema = "rust-standards/adoption/v1"
standards = { version = "draft", commit = "7c9a7577fed4fe5ba0682960c0380af0a75dace4" }

# multiverse publishes a library crate, builds the `mxv` command, starts git
# and app processes, and keeps workspace records and a port ledger on disk.
profiles = ["base", "library", "cli", "child-process", "durable-state"]

[[decision]]
id = "lanes"
requirement = """
- Lane: `lane` in .github/workflows/ci.yml, on each pull request and each push to main. It runs every step of the pull-request lane in the standards' order (format, workflows, deny, shear, clippy, tests, doctests, rustdoc, features), then `msrv` (LIB-4). Its budget is ten minutes, the job's timeout.
- Lane: `advisories` in .github/workflows/ci.yml, daily at 06:43 UTC and on demand (BASE-29). Nothing waits for it.
- Lane: `macos` in .github/workflows/ci.yml, daily at 06:43 UTC and on demand. It runs clippy, tests and doctests on macOS, which builds the macOS-only code. Nothing waits for it.
"""
reason = "The pull-request lane stays within ten minutes on a small workspace and grows with the code. A daily advisory run catches an advisory published against a dependency already on main. A daily macOS run checks the macOS-only code without making pull requests wait for a macOS runner."
realizations = [".github/workflows/ci.yml"]

[[decision]]
id = "release-profile"
requirement = "`[profile.release]` sets `overflow-checks = true` and leaves `lto`, `codegen-units` and `strip` at Cargo's defaults."
reason = "multiverse ships no binary yet, so no measurement shows what a size or speed setting would gain. The pull request that decides how mxv ships records its settings here."
realizations = ["Cargo.toml"]

[[decision]]
id = "unsafe-libproc"
requirement = "`unsafe_code` is `deny` in the workspace lints. Only crates/multiverse/src/process/darwin.rs expects it, and it holds one unsafe block per libproc call (`proc_pidinfo`, `proc_pidfdinfo`, `proc_listpids`), each with a SAFETY comment (BASE-3). The blocks pass only buffers that the module owns, with their sizes, and safe code reads the fields from the bytes."
reason = "macOS gives a process's start time to the microsecond, and the sockets of a process's descriptors, only through libproc, which has no safe interface in std or rustix. The libproc crate wraps it without unsafe code in mxv, but its build runs bindgen, which makes every macOS build need libclang."
realizations = ["Cargo.toml", "crates/multiverse/src/process/darwin.rs"]

[[decision]]
id = "workspace-clones"
requirement = """
- Each workspace's checkout is its own `git clone --shared` of a bare mirror that mxv owns, with a `.git` of its own. The clone starts with no hooks and with git's default config, and its `origin` is the origin of the person's repository. `mxv new` only reads the person's repository.
- mxv keeps one bare mirror for each origin in `$XDG_DATA_HOME/mxv/mirrors`, through the etcetera base directories, which is `~/.local/share/mxv/mirrors` by default. The build plan named the directory `multiverse/`; mxv's data directory is `mxv`, so the mirrors live there.
- A mirror holds only the origin's `refs/heads/*` and `refs/tags/*`. mxv writes nothing under `refs/multiverse/`, which the build plan reserves for archive pins such as `refs/multiverse/archive/<name>/<app>`, and the mirror's fetch and prune touch no other namespace.
- A mirror sets `gc.auto=0`, `gc.pruneExpire=never` and `maintenance.auto=false`, mxv never runs `git gc` or `git prune` in it, and no removal deletes it, because the clones borrow its objects. Each fetch into a mirror holds the mirror's lock.
- A workspace that an earlier mxv made from git worktrees of the person's repository keeps a record of version 1 without a `kind`, and every command keeps working on it through the worktree code.
- Removing a clone fetches its `origin` first and counts as unpushed each commit that the clone or an initialised submodule holds in `HEAD`, a branch, a tag or a note, and that no branch, tag or note of `origin` holds. It also counts each commit made on a detached `HEAD` that only the reflog of `HEAD` holds, unless the reflog of a local branch holds it or a commit with the same patch is on `origin` or a local branch, so a rebase, an amend or a reset on a branch never makes a removal need `--delete-unmerged`. Origin's tags and notes are fetched into `refs/mxv/origin/` in the clone, never into the mirror.
- No origin URL that mxv prints or records carries a user name or password, and neither does any line of git's standard error that mxv quotes.
"""
reason = "This amends the Mirrors row of the build plan that was signed off on 30 October 2026. That row kept a bare mirror of each repository and created every workspace as a git worktree of the mirror, so that mxv never added worktrees to the person's own clone. The bare mirror stays, and each workspace becomes a `git clone --shared` from it in place of a worktree. A worktree shares its repository's git directory, including its hooks, config and branches, so an agent in one workspace could move another workspace's branch or run a hook that someone planted there. A sandboxed agent must not be able to write a shared git directory. The eval `/evals/agent-sandbox-macos` in the personal board confined an agent's process to its workspace on macOS only with a git directory for each workspace: with worktrees of a shared mirror, the sandbox had to let the agent write the mirror, and an agent in one workspace moved another workspace's branch. A clone with its own `.git` lets the sandbox allow writes to the workspace alone."
realizations = [
    "crates/multiverse/src/mirror.rs",
    "crates/multiverse/src/workspaces.rs",
    "crates/multiverse/src/git.rs",
    "crates/multiverse/src/record.rs",
    "crates/mxv/src/environment.rs",
]

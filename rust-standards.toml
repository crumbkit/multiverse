# multiverse's adoption map of the Rust standards (adoption.md of
# https://github.com/crumbkit/rust-standards). The standards have no released
# version yet, so the map names the draft and the commit it was reviewed
# against.

schema = "rust-standards/adoption/v1"
standards = { version = "draft", commit = "7c9a7577fed4fe5ba0682960c0380af0a75dace4" }

# multiverse publishes a library crate, builds the `mxv` command, starts git
# and app processes, and keeps workspace records and a port ledger on disk.
profiles = ["base", "library", "cli", "child-process", "durable-state"]

[[decision]]
id = "lanes"
requirement = """
- Lane: `lane` in .github/workflows/ci.yml, on each pull request and each push to main. It runs every step of the pull-request lane in the standards' order (format, workflows, deny, shear, clippy, tests, doctests, rustdoc, features), then `msrv` (LIB-4). Its budget is ten minutes, the job's timeout.
- Lane: `advisories` in .github/workflows/ci.yml, daily at 06:43 UTC and on demand (BASE-29). Nothing waits for it.
- Lane: `macos` in .github/workflows/ci.yml, daily at 06:43 UTC and on demand. It runs clippy, tests and doctests on macOS, which builds the macOS-only code. Nothing waits for it.
"""
reason = "The pull-request lane stays within ten minutes on a small workspace and grows with the code. A daily advisory run catches an advisory published against a dependency already on main. A daily macOS run checks the macOS-only code without making pull requests wait for a macOS runner."
realizations = [".github/workflows/ci.yml"]

[[decision]]
id = "release-profile"
requirement = "`[profile.release]` sets `overflow-checks = true` and leaves `lto`, `codegen-units` and `strip` at Cargo's defaults."
reason = "multiverse ships no binary yet, so no measurement shows what a size or speed setting would gain. The pull request that decides how mxv ships records its settings here."
realizations = ["Cargo.toml"]

[[decision]]
id = "unsafe-libproc"
requirement = "`unsafe_code` is `deny` in the workspace lints. Only crates/multiverse/src/process/darwin.rs expects it, and it holds one unsafe block per libproc call (`proc_pidinfo`, `proc_pidfdinfo`, `proc_listpids`), each with a SAFETY comment (BASE-3). The blocks pass only buffers that the module owns, with their sizes, and safe code reads the fields from the bytes."
reason = "macOS gives a process's start time to the microsecond, and the sockets of a process's descriptors, only through libproc, which has no safe interface in std or rustix. The libproc crate wraps it without unsafe code in mxv, but its build runs bindgen, which makes every macOS build need libclang."
realizations = ["Cargo.toml", "crates/multiverse/src/process/darwin.rs"]

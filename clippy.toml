# The union of the clippy.toml fragments of the base, child-process and
# durable-state profiles of the Rust standards. Each effect belongs to one
# owning module per crate, which suppresses the lint with #[expect] and a
# reason (BASE-5). Each entry's reason names the owning modules.
#
# The owners of each effect:
# - the clock: crates/multiverse/src/clock.rs, crates/phase/src/clock.rs and
#   crates/mxv/src/clock.rs;
# - file reads and opens: crates/multiverse/src/store.rs,
#   crates/phase/src/record/store.rs and crates/mxv/src/config.rs;
# - the network: crates/multiverse/src/ports.rs and crates/phase/src/net.rs;
# - the standard streams: crates/mxv/src/lib.rs, through crumbkit::finish.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-indexing-slicing-in-tests = true
too-many-lines-threshold = 150 # BASE-10
max-fn-params-bools = 3 # BASE-16

disallowed-methods = [
    # BASE-6, LIB-1: the program reads its environment once, in main, and
    # the multiverse library reads none.
    { path = "std::env::var", reason = "only crates/mxv/src/main.rs reads the environment, and the library reads none" },
    { path = "std::env::var_os", reason = "only crates/mxv/src/main.rs reads the environment, and the library reads none" },
    { path = "std::env::vars", reason = "only crates/mxv/src/main.rs reads the environment, and the library reads none" },
    { path = "std::env::vars_os", reason = "only crates/mxv/src/main.rs reads the environment, and the library reads none" },
    { path = "std::env::set_var", reason = "build a snapshot in the test instead" },
    { path = "std::env::remove_var", reason = "build a snapshot in the test instead" },
    { path = "std::env::current_dir", reason = "read the directory from the snapshot" },
    { path = "std::env::set_current_dir", reason = "pass the directory to the operation instead" },
    # BASE-7
    { path = "std::process::exit", reason = "return the exit code from main so destructors run" },
    # BASE-11
    { path = "std::thread::sleep", reason = "wait for an observable signal, or sleep in the clock owner" },
    { path = "tokio::time::sleep", reason = "wait for an observable signal, or sleep in the clock owner", allow-invalid = true },
    # BASE-5: the clock
    { path = "std::time::Instant::now", reason = "read the time from the crate's clock module, such as crates/multiverse/src/clock.rs" },
    { path = "std::time::SystemTime::now", reason = "read the time from the crate's clock module, such as crates/multiverse/src/clock.rs" },
    { path = "tokio::time::Instant::now", reason = "read the time from the crate's clock module, such as crates/multiverse/src/clock.rs", allow-invalid = true },
    # BASE-5: file reads and opens
    { path = "std::fs::read", reason = "read files through the crate's store module, such as crates/multiverse/src/store.rs" },
    { path = "std::fs::read_to_string", reason = "read files through the crate's store module, such as crates/multiverse/src/store.rs" },
    { path = "std::fs::read_dir", reason = "read directories through the crate's store module, such as crates/multiverse/src/store.rs" },
    { path = "std::fs::File::open", reason = "open files through the crate's store module, such as crates/multiverse/src/store.rs" },
    { path = "std::fs::File::options", reason = "open files through the crate's store module, such as crates/multiverse/src/store.rs" },
    { path = "tokio::fs::read", reason = "read files through the crate's store module, such as crates/multiverse/src/store.rs", allow-invalid = true },
    { path = "tokio::fs::read_to_string", reason = "read files through the crate's store module, such as crates/multiverse/src/store.rs", allow-invalid = true },
    { path = "tokio::fs::read_dir", reason = "read directories through the crate's store module, such as crates/multiverse/src/store.rs", allow-invalid = true },
    { path = "tokio::fs::write", reason = "write through the library's store module", allow-invalid = true },
    { path = "tokio::fs::File::open", reason = "open files through the crate's store module, such as crates/multiverse/src/store.rs", allow-invalid = true },
    { path = "tokio::fs::File::create", reason = "write through the library's store module", allow-invalid = true },
    { path = "tokio::fs::OpenOptions::new", reason = "write through the library's store module", allow-invalid = true },
    # BASE-5: the network
    { path = "std::net::TcpStream::connect", reason = "connect through the crate's network module, crates/multiverse/src/ports.rs or crates/phase/src/net.rs" },
    { path = "std::net::TcpStream::connect_timeout", reason = "connect through the crate's network module, crates/multiverse/src/ports.rs or crates/phase/src/net.rs" },
    { path = "tokio::net::TcpStream::connect", reason = "connect through the crate's network module, crates/multiverse/src/ports.rs or crates/phase/src/net.rs", allow-invalid = true },
    # BASE-5: the standard streams (CLI-1)
    { path = "std::io::stdout", reason = "print through crumbkit::finish in crates/mxv/src/lib.rs" },
    { path = "std::io::stderr", reason = "print through crumbkit::finish in crates/mxv/src/lib.rs" },
    { path = "std::io::stdin", reason = "read through crumbkit's Output in crates/mxv/src/lib.rs, which knows whether input is a terminal" },
    # PROC-1
    { path = "std::process::Command::new", reason = "start processes through the library's git and process modules" },
    { path = "std::process::Command::spawn", reason = "start processes through the library's git and process modules" },
    { path = "std::process::Command::status", reason = "start processes through the library's git and process modules" },
    { path = "std::process::Command::output", reason = "start processes through the library's git and process modules" },
    { path = "std::os::unix::process::CommandExt::exec", reason = "replacing this process bypasses the process module" },
    { path = "tokio::process::Command::new", reason = "start processes through the library's git and process modules", allow-invalid = true },
    { path = "tokio::process::Command::spawn", reason = "start processes through the library's git and process modules", allow-invalid = true },
    { path = "tokio::process::Command::status", reason = "start processes through the library's git and process modules", allow-invalid = true },
    { path = "tokio::process::Command::output", reason = "start processes through the library's git and process modules", allow-invalid = true },
    { path = "crumbkit_process::run", reason = "start processes through the library's git and process modules" },
    # BASE-5: the file system, whose writes the atomic writer owns (DUR-1)
    { path = "std::fs::write", reason = "write through the library's store module" },
    { path = "std::fs::File::create", reason = "write through the library's store module" },
    { path = "std::fs::OpenOptions::new", reason = "write through the library's store module" },
    # DUR-1
    { path = "std::fs::copy", reason = "write through the library's store module" },
    { path = "std::fs::rename", reason = "write through the library's store module" },
    # DUR-2
    { path = "std::fs::File::lock", reason = "lock through the library's store module, which owns the deadline" },
    { path = "std::fs::File::try_lock", reason = "lock through the library's store module, which owns the deadline" },
    { path = "std::fs::File::lock_shared", reason = "lock through the library's store module, which owns the deadline" },
    { path = "std::fs::File::try_lock_shared", reason = "lock through the library's store module, which owns the deadline" },
    # DUR-1 and DUR-2: crumbkit-durable writes and locks behind the store
    # modules, crates/multiverse/src/store.rs and crates/phase/src/record/store.rs.
    { path = "crumbkit_durable::write_atomically", reason = "write through the library's store module" },
    { path = "crumbkit_durable::PathLock::acquire", reason = "lock through the library's store module, which owns the deadline" },
    { path = "crumbkit_durable::PathLock::acquire_unless", reason = "lock through the library's store module, which owns the deadline" },
]

disallowed-types = [
    # PROC-1
    { path = "std::process::Child", reason = "let the library's process module hold the child, which owns its deadline and cleanup" },
]

# BASE-5: the standard-stream macros. BASE-7: the untyped-error macros of
# the project's error crates. multiverse depends on no error crate yet.
disallowed-macros = [
    { path = "std::println", reason = "print through crumbkit::finish in crates/mxv/src/lib.rs" },
    { path = "std::eprintln", reason = "print through crumbkit::finish in crates/mxv/src/lib.rs" },
    { path = "std::print", reason = "print through crumbkit::finish in crates/mxv/src/lib.rs" },
    { path = "std::eprint", reason = "print through crumbkit::finish in crates/mxv/src/lib.rs" },
]
